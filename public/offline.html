<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Pick'em · Offline</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #0b0e14; color: #eef0f4; font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
  main { min-height: 100vh; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; }
  img { width: 72px; height: 72px; margin: 0 auto; border-radius: 18px; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 0; color: #a3a9b6; max-width: 22rem; }
  button { margin: 8px auto 0; height: 40px; padding: 0 20px; border: 0; border-radius: 999px; background: #4ccf5a; color: #0b0e14; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Picks and scores are always live, so Pick'em needs a connection. It'll pick up where you left off once you're back.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
